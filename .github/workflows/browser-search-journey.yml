name: Browser Search Journey

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-search-journey.yml'
      - 'synthetics/browser-search-journey.mjs'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  browser-search-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser search journey
        run: xvfb-run -a node synthetics/browser-search-journey.mjs
        env:
          TARGET_URL: https://oceanliners.net/
